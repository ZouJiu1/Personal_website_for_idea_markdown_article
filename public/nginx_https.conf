# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user root;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

# Load dynamic modules. See /usr/share/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1000;
    # multi_accept on;
}

http {
    sendfile on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   60;
    types_hash_max_size 3000;

    include ./mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;

    gzip on;
    gzip_types          text/plain application/javascript text/css;  

    # ---------- 应用层限流（防 DDoS / 短时大流量）----------
    # 每 IP 对后端 API 限 10 请求/秒，允许 20 个突发（nodelay：突发立即放行不排队）。
    # zone 为全部 API location 共享：同一 IP 打任意接口合并计数。
    # Django 层 antiflood 中间件（100/s 突发、1000 在线容量）为第二道防线。
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    # 每 IP 并发连接数上限（配合上面的速率限制，防连接洪水）
    limit_conn_zone $binary_remote_addr zone=connperip:10m;

    server {
        server_name zoujiu.com.cn; 
        listen 443 ssl;
        ssl_certificate cert/zoujiu.com.cn.pem;
        ssl_certificate_key cert/zoujiu.com.cn.key;
 
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 5m;
	 
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
        ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;

        ssl_prefer_server_ciphers on;

        #root /home/admin/vue-project/dist;
        client_max_body_size 200m; # 通用请求体上限：防超大垃圾包（视频上传在 /upload_video 单独放开）
        location / {
            #proxy_pass http://localhost:7290;
            index /index.html;
            root /home/admin/vue-project/dist;
            try_files $uri $uri/ /index.html;
            # index /index.html;
            client_max_body_size 200m;
            add_header Cache-Control "no-cache";
        }
        location /article {
            root /home/admin/vue-project;
            # 用户内容会增删改，禁止启发式缓存：强制回源校验（未变 304，已删 404）
            add_header Cache-Control "no-cache";
        }
        location /people {
            root /home/admin/vue-project;
            # 同上：删除图片后浏览器缓存立即失效，不再显示已删图片
            add_header Cache-Control "no-cache";
        }	
        location /csdn {
            proxy_pass http://localhost:7290;
            limit_req zone=api burst=20 nodelay;
            limit_conn connperip 20;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /markdown_detail {
            proxy_pass http://localhost:7290;
            limit_req zone=api burst=20 nodelay;
            limit_conn connperip 20;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /;   
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /zhihu {
            proxy_pass http://localhost:7290;
            limit_req zone=api burst=20 nodelay;
            limit_conn connperip 20;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /think {
            proxy_pass http://localhost:7290;
            limit_req zone=api burst=20 nodelay;
            limit_conn connperip 20;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /video {
            proxy_pass http://localhost:7290;
            limit_req zone=api burst=20 nodelay;
            limit_conn connperip 20;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /travel {
            proxy_pass http://localhost:7290;
            limit_req zone=api burst=20 nodelay;
            limit_conn connperip 20;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /upload_video {
            # 视频是整文件单请求上传（服务端 f.chunks() 流式写盘）：此处单独保留大 body 上限
            client_max_body_size 3000m;
            proxy_pass http://localhost:7290;
            limit_req zone=api burst=20 nodelay;
            limit_conn connperip 20;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /commonuse {
            proxy_pass http://localhost:7290;
            limit_req zone=api burst=20 nodelay;
            limit_conn connperip 20;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /everydayimg {
            proxy_pass http://localhost:7290;
            limit_req zone=api burst=20 nodelay;
            limit_conn connperip 20;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
        # This URL provides RTMP statistics in XML
        location /stat {
            rtmp_stat all;
            # Use this stylesheet to view XML as web page
            # in browser
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            # XML stylesheet to view RTMP stats.
            # Copy stat.xsl wherever you want
            # and put the full directory path here
            root /home/admin/vue-project/stat.xsl;
        }

        location /hls {
            # Serve HLS fragments
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /home/admin/vue-project;
            add_header Cache-Control no-cache;
	        add_header Access-Control-Allow-Origin *;
        }

        # location /dash {
            # Serve DASH fragments
            # root /home/admin/rtmp;
            # add_header Cache-Control no-cache;
        # }
        # location /article/ {
        # 	root /home/admin/vue-project/dist;
        # }
    }
    server {
        listen 80;
        server_name zoujiu.com.cn;
        rewrite ^(.*)$ https://$host$1;
        location / {
            index index.html index.htm;
       }
    }
}

rtmp {
    server {
        listen 2061;
        chunk_size 4000;

        application big {
            live on;
        }

        application hls {
            live on;
            hls on;
            hls_path /home/admin/vue-project/hls;
            hls_fragment 5s;
            hls_playlist_length 15s;
            # hls_sync 100ms;
            # hls_continuous on;
            # hls_base_url http://localhost:443/hls/;
            # hls_cleanup on;
            # hls_fragment_naming system;
            # hls_fragment_naming_granularity 500;
            # hls_fragment_slicing aligned;
            hls_type event;
        }
    }
}
